        const start = [249, 199];
        const goal = [246, 198];
        const paths = {"Manhattan": [[248, 198], [247, 198], [246, 198]], "Euclidean": [[248, 199], [247, 198], [246, 198]], "Diagonal": [[248, 199], [247, 199], [246, 198]], "Hybrid": [[248, 198], [247, 198], [246, 198]]};

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        let scale = 10;

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[0].length; x++) {
                    ctx.fillStyle = grid[y][x] === 1 ? '#000' : '#eee';
                    ctx.fillRect(x * scale, y * scale, scale, scale);

                    // Light cell border
                    ctx.strokeStyle = '#ccc';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x * scale, y * scale, scale, scale);
                }
            }

            drawCircle(start[1], start[0], 'green');
            drawCircle(goal[1], goal[0], 'red');

            const colors = ['blue', 'orange', 'purple', 'cyan'];
            let i = 0;
            for (let key in paths) {
                drawPath(paths[key], colors[i % colors.length]);
                i++;
            }
        }

        function drawPath(path, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < path.length; i++) {
                const [y, x] = path[i];
                const px = x * scale + scale / 2;
                const py = y * scale + scale / 2;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
        }

        function drawCircle(x, y, color) {
            ctx.beginPath();
            ctx.arc(x * scale + scale / 2, y * scale + scale / 2, scale / 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function zoom(factor) {
            scale *= factor;
            drawMap();
        }

        drawMap();
